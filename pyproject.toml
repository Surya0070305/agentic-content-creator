dependencies = [
    "google-search-results>=2.4.2",
    "langchain[mcp]>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.1.0",
    "mcp>=2.3.0",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.4",
    "tiktoken>=0.14.0",
    "trafilatura>=2.3.1",
    "guardrails-ai>=0.5",
    "presidio-anonymizer>=2.2.366",
    "guardrails-ai-toxic-language>=0.0.2",
    "guardrails-ai-detect-pii>=0.0.6",
    "guardrails-ai-nsfw-text>=0.1.0",
    "guardrails-ai-prompt-injection-detector>=0.0.2",
    "llm>=0.32.1",
    "streamlit>=1.67.0",
    "langgraph>=1.2.18",
